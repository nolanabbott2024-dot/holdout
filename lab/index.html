<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Holdout Lab</title>
<style>
  :root{--ink:#d9d4c7;--dim:#8d887b;--acc:#c9a24a;--bg:rgba(12,13,12,.62)}
  html,body{margin:0;height:100%;background:#111;overflow:hidden;font:12px/1.3 ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
  #c{width:100vw;height:100vh;display:block;touch-action:none;outline:none}
  .hud{position:fixed;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;max-width:calc(100vw - 24px)}
  .row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .tag{background:var(--bg);padding:5px 8px;letter-spacing:.08em;text-transform:uppercase}
  .tag b{color:var(--acc);font-weight:600}
  button{background:var(--bg);color:var(--ink);border:1px solid rgba(217,212,199,.18);padding:5px 9px;font:inherit;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
  button.on{border-color:var(--acc);color:var(--acc)}
  #st{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--bg);padding:6px 12px;letter-spacing:.1em;text-transform:uppercase}
  #st:empty{display:none}
  #help{position:fixed;right:12px;bottom:12px;color:var(--dim);background:var(--bg);padding:5px 8px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="row"><span class="tag"><b>HOLDOUT</b> · graphics lab · Babylon.js</span><span class="tag" id="fps">—</span><span class="tag" id="lib"></span></div>
  <div class="row" id="q"></div>
  <div class="row" id="shots"></div>
</div>
<div id="st">booting…</div>
<div id="help">click + WASD / mouse · drag on touch</div>
<script type="module" src="lab.js"></script>
</body>
</html>
