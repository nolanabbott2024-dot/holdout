<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Holdout</title>
<meta name="theme-color" content="#0b0a09">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#e4ddcc;--dim:#8c8574;--faint:#57524a;--acc:#d6a54a;--acc2:#f0c060;--red:#c8453a;--grn:#7fae6a;--bg:rgba(11,10,9,.78);--line:rgba(228,221,204,.14);--hd:'Barlow Condensed',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0a09;color:var(--ink);overflow:hidden;font:13px/1.4 var(--mono);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;outline:none;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.screen{position:fixed;inset:0;display:none}
/* loading */
#loading{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#16130f 0,#0b0a09 70%);z-index:40;gap:10px}
#loadT{font:600 26px var(--hd);letter-spacing:.14em;text-transform:uppercase}
#loadS{color:var(--dim);min-height:1.4em}
#loading .spin{width:44px;height:2px;background:var(--faint);position:relative;overflow:hidden}#loading .spin:after{content:"";position:absolute;inset:0;width:40%;background:var(--acc);animation:sl 1.1s ease-in-out infinite}
@keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
/* title */
#title{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 max(24px,6vw) 9vh;background:linear-gradient(90deg,rgba(8,7,6,.92) 0,rgba(8,7,6,.55) 45%,rgba(8,7,6,0) 75%);z-index:50}
#title h1{font:700 clamp(64px,13vw,168px)/.82 var(--hd);letter-spacing:.02em;margin:0;color:var(--ink)}
#title h1 span{color:var(--acc)}
#title .tag{color:var(--dim);letter-spacing:.2em;text-transform:uppercase;margin:14px 0 36px;font-size:12px}
#title .btns{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.big{font:600 22px var(--hd);letter-spacing:.12em;text-transform:uppercase;padding:12px 22px;border:1px solid var(--line);background:var(--bg);min-width:280px;text-align:left;transition:.15s}
.big:hover,.big.prime{border-color:var(--acc);color:var(--acc2)}
.big.prime{background:rgba(214,165,74,.12)}
#tSettings,#pSettings{display:grid;gap:10px;margin-top:22px;max-width:420px;width:100%}
label{display:grid;grid-template-columns:1fr 150px 54px;align-items:center;gap:10px;color:var(--dim)}
label b{color:var(--ink);font-weight:500;text-align:right}
input[type=range]{width:100%;accent-color:var(--acc)}
.qs{display:flex;gap:4px;grid-column:2/4}.qs button{padding:3px 8px;border:1px solid var(--line);text-transform:uppercase;font-size:11px}.qs button.on{border-color:var(--acc);color:var(--acc)}
#title .keys{color:var(--faint);margin-top:26px;font-size:11px;max-width:560px}
/* hub */
#hub{flex-direction:column;pointer-events:none}
#hubUI{position:absolute;inset:0;display:grid;grid-template-rows:auto auto 1fr;pointer-events:none}
#hubUI header,#hubUI nav,#hubUI section>*{pointer-events:auto}
#hubUI header{display:flex;align-items:center;gap:22px;padding:14px max(16px,3vw);background:linear-gradient(180deg,rgba(8,7,6,.9),rgba(8,7,6,0));flex-wrap:wrap}
.brand{font:700 28px var(--hd);letter-spacing:.08em;color:var(--acc)}
.day{color:var(--dim);letter-spacing:.08em}.day b{color:var(--ink)}
.res{display:flex;gap:14px;margin-left:auto;flex-wrap:wrap}.res span{color:var(--dim)}.res b{color:var(--ink);font-weight:500}
#hubUI nav{display:flex;gap:2px;padding:0 max(16px,3vw)}
#hubUI nav button{font:600 17px var(--hd);letter-spacing:.12em;text-transform:uppercase;padding:8px 16px;color:var(--dim);border-bottom:2px solid transparent}
#hubUI nav button.on{color:var(--ink);border-color:var(--acc)}
#hubUI nav .menu{margin-left:auto}
#hubUI section{padding:16px max(16px,3vw);overflow:auto;display:flex;align-items:flex-start}
#hubUI section>*{background:var(--bg);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cols{display:grid;grid-template-columns:minmax(260px,360px) minmax(280px,440px);gap:0;max-width:100%}
.board{display:flex;flex-direction:column;border-right:1px solid var(--line)}
.mis{display:grid;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);gap:2px}
.mis em{font-style:normal;font-size:10px;letter-spacing:.2em;color:var(--dim)}.mis.loot em{color:#9fb5c9}.mis.rescue em{color:var(--grn)}.mis.raid em{color:var(--red)}
.mis b{font:600 20px var(--hd);letter-spacing:.04em}.mis span{color:var(--dim);font-size:12px}
.mis.on{background:rgba(214,165,74,.1);box-shadow:inset 3px 0 0 var(--acc)}
.brief{padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.brief em{font-style:normal;color:var(--dim);font-size:11px;letter-spacing:.18em}
.brief h2{font:700 34px var(--hd);margin:0;letter-spacing:.03em}
.brief p{color:#c8c0ae;margin:0 0 8px}
.lo{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}.lo h3,.dbg h3{font:600 13px var(--hd);letter-spacing:.2em;color:var(--dim);margin:0}
.lo label{grid-template-columns:150px 1fr 44px}.lo small{color:var(--faint)}
.deploy{margin-top:14px;font:700 24px var(--hd);letter-spacing:.16em;padding:12px;background:var(--acc);color:#14110c;border:0}
.deploy:hover{background:var(--acc2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1px;background:var(--line)!important;max-width:760px}
.it{background:#0e0d0b;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:baseline}
.it i{font-style:normal;color:var(--acc);font-size:18px}.it b{font:600 26px var(--hd)}.it span{grid-column:1/3;color:var(--ink)}.it small{grid-column:1/3;color:var(--faint)}
.act{position:absolute;margin-top:8px}
section .act{position:static;border:0!important;background:none!important;display:flex;gap:8px;padding:10px 0}
.act button,.up button{border:1px solid var(--acc);color:var(--acc2);padding:6px 12px}
button:disabled{opacity:.35;cursor:default;border-color:var(--faint)!important;color:var(--dim)!important}
.ups{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1px;background:var(--line)!important;max-width:980px}
.up{background:#0e0d0b;padding:14px;display:flex;flex-direction:column;gap:4px}.up b{font:600 20px var(--hd);letter-spacing:.04em}.up em{font-style:normal;color:var(--acc);letter-spacing:.2em}.up p{margin:0;color:#c8c0ae}.up .next{color:var(--dim)}.up small{color:var(--grn);letter-spacing:.2em}
.up button{margin-top:auto;align-self:flex-start}
.ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1px;background:var(--line)!important;max-width:880px}
.p{background:#0e0d0b;padding:12px 14px;display:grid;gap:4px}.p b{font:600 20px var(--hd)}.p span{color:var(--dim)}.p.you b{color:var(--acc)}
.bar{height:3px;background:#2a2722}.bar i{display:block;height:100%;background:var(--grn)}
.note{margin:0;padding:10px 14px;color:var(--dim);border:0!important;background:none!important}
.log{padding:14px 18px;max-width:640px;max-height:60vh;overflow:auto}.log p{margin:0 0 6px;color:#c8c0ae}
#hubUI section:has(.ppl),#hubUI section:has(.grid){flex-direction:column}
/* debrief */
#debrief{align-items:center;justify-content:center;background:rgba(8,7,6,.86);z-index:30}
.db{max-width:900px;width:100%;padding:24px}.db em{font-style:normal;color:var(--dim);letter-spacing:.2em}
.db h1{font:700 clamp(56px,10vw,110px)/.9 var(--hd);margin:4px 0 20px;letter-spacing:.04em}.db h1.ok{color:var(--grn)}.db h1.kia,.db h2.kia{color:var(--red)}
.dbg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px;margin-bottom:26px}.dbg p{margin:0 0 4px}.dim{color:var(--faint)}
.db button{font:700 22px var(--hd);letter-spacing:.14em;padding:12px 22px;background:var(--acc);color:#14110c}
/* raid hud */
#hud{display:none;position:fixed;inset:0;pointer-events:none;z-index:10}
#obj{position:absolute;left:22px;top:18px;max-width:42vw}#objT{font:600 13px var(--hd);letter-spacing:.22em;color:var(--acc)}#objX{font:600 20px var(--hd);letter-spacing:.03em;text-shadow:0 1px 3px #000}
#comp{position:absolute;left:50%;top:14px;width:300px;height:30px;transform:translateX(-50%);overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);mask:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}
#compStrip{position:absolute;left:150px;top:0;height:100%}
#compStrip i{position:absolute;top:2px;font-style:normal;font-size:10px;color:var(--dim);transform:translateX(-50%)}#compStrip i.card{color:var(--ink);font:600 15px var(--hd);top:0}#compStrip i.mid{color:var(--faint)}
#compStrip i:not(.card):not(.mid):after{content:"";position:absolute;left:50%;top:0;width:1px;height:5px;background:var(--faint)}
#compMarks i{position:absolute;top:19px;width:7px;height:7px;transform:translateX(-50%) rotate(45deg)}#compMarks i.ex{background:var(--red)}#compMarks i.ob{background:var(--acc)}
#comp:after{content:"";position:absolute;left:50%;bottom:0;width:1px;height:8px;background:var(--acc)}
#vitals{position:absolute;left:22px;bottom:22px;width:240px;display:grid;gap:5px}
.vb{height:5px;background:rgba(255,255,255,.1)}#hpFill{height:100%;background:var(--ink);transition:width .2s}#hpFill.low{background:var(--red)}#stFill{height:100%;background:var(--dim)}
#meds{color:var(--dim);font-size:12px}
#ammo{position:absolute;right:24px;bottom:20px;text-align:right}
#mag{font:600 52px/1 var(--hd);text-shadow:0 2px 6px #000}#res{font:500 20px var(--hd);color:var(--dim);margin-left:4px}
#wpn{font:600 14px var(--hd);letter-spacing:.16em;color:var(--acc)}#kg{color:var(--dim);font-size:11px;letter-spacing:.1em}
#xh{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}
#xh i{position:absolute;background:rgba(255,255,255,.85);box-shadow:0 0 2px #000}#xh i:nth-child(1){left:10px;top:0;width:2px;height:6px}#xh i:nth-child(2){left:10px;bottom:0;width:2px;height:6px}#xh i:nth-child(3){top:10px;left:0;width:6px;height:2px}#xh i:nth-child(4){top:10px;right:0;width:6px;height:2px}
.hitm{position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%) rotate(45deg);opacity:0}
.hitm:before,.hitm:after{content:"";position:absolute;background:#fff;left:12px;top:0;width:2px;height:26px;-webkit-mask:linear-gradient(#000 35%,transparent 35% 65%,#000 65%);mask:linear-gradient(#000 35%,transparent 35% 65%,#000 65%)}.hitm:after{transform:rotate(90deg)}
.hitm.show{opacity:1}.hitm.head:before,.hitm.head:after{background:var(--acc2)}.hitm.kill:before,.hitm.kill:after{background:var(--red)}
#prompt{position:absolute;left:50%;top:60%;transform:translateX(-50%);font:600 17px var(--hd);letter-spacing:.06em;text-shadow:0 1px 4px #000;white-space:nowrap}
#promptBar{position:absolute;left:50%;top:calc(60% + 28px);width:160px;height:3px;transform:translateX(-50%);background:rgba(255,255,255,.15);display:none}#promptFill{height:100%;background:var(--acc)}
#extract{position:absolute;left:50%;top:20%;transform:translateX(-50%);width:260px;text-align:center;display:none;font:600 15px var(--hd);letter-spacing:.2em;color:var(--grn)}#extract .eb{height:3px;background:rgba(255,255,255,.15);margin-top:6px}#extractFill{height:100%;background:var(--grn)}
#feed{position:absolute;right:24px;top:22px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.fi{background:var(--bg);padding:4px 10px;border-left:2px solid var(--acc);transition:opacity .6s}.fi.warn{border-color:var(--red)}.fi.out{opacity:0}
#vign{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(120,0,0,.6) 100%);transition:opacity .4s}
#vign.flash{animation:fl .35s}@keyframes fl{0%{filter:brightness(2.2)}100%{filter:none}}
#dmgDir{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0}#dmgDir:after{content:"";position:absolute;left:-40px;top:-170px;width:80px;height:26px;background:radial-gradient(ellipse at center bottom,rgba(220,30,20,.8),transparent 70%)}
#dmgDir.show{animation:dd 1.1s}@keyframes dd{0%{opacity:1}100%{opacity:0}}
#marks .mk{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;margin:-22px 0 0 -40px;width:80px;font:600 11px var(--hd);letter-spacing:.16em;text-shadow:0 1px 3px #000}
#marks .mk:before{content:"";width:9px;height:9px;transform:rotate(45deg);margin-bottom:3px}#marks .mk.ex:before{background:var(--red)}#marks .mk.ob:before{background:var(--acc)}
#marks .mk span{color:var(--dim);font-family:var(--mono);font-weight:400;letter-spacing:0}
/* pause / click to play */
#pause{position:fixed;inset:0;display:none;flex-direction:column;justify-content:center;padding:0 max(24px,8vw);background:rgba(8,7,6,.8);z-index:45;gap:8px}
#pause h2{font:700 54px var(--hd);margin:0 0 16px;letter-spacing:.08em}
#clickToPlay{align-items:center;justify-content:center;flex-direction:column;z-index:44;background:rgba(8,7,6,.55);cursor:pointer;gap:6px}
#clickToPlay b{font:700 34px var(--hd);letter-spacing:.14em}#clickToPlay span{color:var(--dim)}
/* touch */
#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:11}
#stick{position:absolute;left:40px;bottom:60px;width:120px;height:120px;border-radius:50%;border:1px solid var(--line);opacity:.35}#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(228,221,204,.25)}
#touch .tb{position:absolute;pointer-events:auto;width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:rgba(11,10,9,.45);font:600 12px var(--hd);letter-spacing:.08em;display:flex;align-items:center;justify-content:center}
#tFire{right:28px;bottom:120px;width:84px!important;height:84px!important;border-color:var(--acc)!important}#tAim{right:124px;bottom:150px}#tReload{right:120px;bottom:70px}#tUse{right:40px;bottom:220px}#tJump{right:200px;bottom:40px}#tSwap{right:24px;top:110px}#tMed{right:92px;top:110px}#tSprint{left:30px;bottom:200px}
@media (max-width:760px){.cols{grid-template-columns:1fr}.board{border-right:0}#vitals{width:150px}#mag{font-size:38px}#obj{max-width:60vw}#objX{font-size:16px}#hubUI header{gap:10px}.res{margin-left:0;font-size:11px;gap:8px}label{grid-template-columns:1fr 110px 44px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">
  <h1>HOLD<span>OUT</span></h1>
  <div class="tag">Underground since day one · Topside is the Zone</div>
  <div class="btns"><button class="big prime" id="cont">Enter the shelter</button><button class="big" id="newg">New game</button></div>
  <div id="tSettings"></div>
  <div class="keys"><a href="/classic" style="color:var(--dim)">Classic version</a> · WASD move · Shift sprint · C crouch · Space jump · Mouse aim/fire · R reload · Q swap · B fire mode · E search / talk · 4 med kit · Esc pause</div>
</div>
<div id="loading"><div id="loadT">Loading</div><div class="spin"></div><div id="loadS"></div></div>
<div id="hub" class="screen"><div id="hubUI"></div></div>
<div id="debrief" class="screen"></div>
<div id="clickToPlay" class="screen"><b>CLICK TO PLAY</b><span>Esc pauses</span></div>
<div id="pause"><h2>PAUSED</h2><button class="big prime" data-resume="1">Resume</button><button class="big" data-abandon="1">Abandon run (lose pack)</button><div id="pSettings"></div></div>
<div id="hud">
  <div id="vign"></div><div id="dmgDir"></div>
  <div id="obj"><div id="objT"></div><div id="objX"></div></div>
  <div id="comp"><div id="compStrip"></div><div id="compMarks"></div></div>
  <div id="marks"></div>
  <div id="xh"><i></i><i></i><i></i><i></i></div><div id="hitm" class="hitm"></div>
  <div id="prompt"></div><div id="promptBar"><div id="promptFill"></div></div>
  <div id="extract">EXTRACTING<div class="eb"><div id="extractFill"></div></div></div>
  <div id="feed"></div>
  <div id="vitals"><div class="vb"><div id="hpFill"></div></div><div class="vb"><div id="stFill"></div></div><div id="meds"></div></div>
  <div id="ammo"><div><span id="mag">30</span><span id="res">/ 0</span></div><div id="wpn"></div><div id="kg"></div></div>
</div>
<div id="touch"><div id="stick"><div id="knob"></div></div>
  <button class="tb" id="tFire">FIRE</button><button class="tb" id="tAim">AIM</button><button class="tb" id="tReload">RLD</button><button class="tb" id="tUse">USE</button><button class="tb" id="tJump">JUMP</button><button class="tb" id="tSwap">SWAP</button><button class="tb" id="tMed">MED</button><button class="tb" id="tSprint">RUN</button></div>
<script type="module" src="/game/game.js"></script>
</body>
</html>
