<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Holdout</title><script>window.HOLDOUT_WEB=1;window.HOLDOUT_BUILD='93ef618bf5'</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: ops-board base (panels on a dark wall) + full-bleed field view with a thin tactical HUD. Single dark look by design. */
:root{
  --bg:#0e1114; --panel:#151a1f; --panel2:#1c2228; --line:#2c333b; --fg:#dadfd5; --dim:#8a939b;
  --amber:#e3a23b; --amber-ink:#1a1206; --clear:#5fb3a1; --danger:#d65a4c;
  --disp:'Barlow Condensed',ui-sans-serif,'Arial Narrow',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--fg)}
body{font-family:var(--mono);font-size:13px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--disp);font-weight:700;text-wrap:balance;margin:0;letter-spacing:.02em}
.dim{color:var(--dim)}
.eyebrow{font-family:var(--disp);text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--amber)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 12px;border:1px solid var(--line);background:var(--panel2);border-radius:3px;cursor:pointer;font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.btn:hover{border-color:var(--amber)}
.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn[disabled]{opacity:.4;cursor:not-allowed;border-color:var(--line)}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.danger{border-color:var(--danger);color:#f3c4bd}
.btn.sm{min-height:28px;font-size:13px;padding:0 8px}
.cost{font-family:var(--mono);font-size:11px;color:var(--dim);text-transform:none;letter-spacing:0}
.btn.primary .cost{color:var(--amber-ink)}

/* ---------- BASE ---------- */
#base{position:fixed;inset:0;overflow:auto;padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.bhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:14px}
.bhead h1{font-size:clamp(40px,7vw,64px);line-height:.9;text-transform:uppercase}
.res{display:flex;flex-wrap:wrap;gap:6px}
.res div{background:var(--panel);border:1px solid var(--line);padding:6px 10px;min-width:74px;border-radius:3px}
.res b{display:block;font-family:var(--disp);font-size:24px;font-variant-numeric:tabular-nums;line-height:1}
.res span{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim)}
.res .low b{color:var(--danger)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:22px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel h2 .dim{font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.04em;text-transform:none}
.squadp{grid-column:1/-1}
.squad{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.card{border:1px solid var(--line);background:var(--panel2);border-radius:3px;padding:10px;display:flex;flex-direction:column;gap:8px;position:relative}
.card.on{border-color:var(--amber);box-shadow:inset 3px 0 0 var(--amber)}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .nm{font-family:var(--disp);font-size:22px;font-weight:700;text-transform:uppercase;line-height:1}
.chip{font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:2px 6px;border:1px solid var(--line);border-radius:2px;white-space:nowrap}
.chip.rk{border-color:#4a5560}
.hpbar{height:5px;background:#0a0d10;border-radius:2px;overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--clear)}
.hpbar i.mid{background:var(--amber)} .hpbar i.lo{background:var(--danger)}
.card .row{display:flex;gap:6px;flex-wrap:wrap}
.deploy{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fac{display:flex;flex-direction:column;gap:10px}
.fac .f{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.fac .f:first-child{border-top:0;padding-top:0}
.fac .f h3{font-size:18px;text-transform:uppercase}
.fac .f p{margin:2px 0 0;color:var(--dim);font-size:12px;line-height:1.45}
.lvl{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.lvl i{width:8px;height:8px;border:1px solid var(--amber);border-radius:1px}
.lvl i.f{background:var(--amber)}
.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);background:var(--panel2);border-radius:3px;padding:10px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.item p{margin:0;line-height:1.45;min-width:0;flex:1 1 180px}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:2px 6px;border-radius:2px;margin-right:6px}
.tag.new{background:#2b2416;color:var(--amber)} .tag.ok{background:#16302a;color:var(--clear)} .tag.bad{background:#341a17;color:var(--danger)} .tag.mark{background:#20283a;color:#9fb4e6}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto;font-size:12px;line-height:1.5}
.log li{border-left:2px solid var(--line);padding-left:8px;color:#b8bfb4}
.log li:first-child{border-color:var(--amber);color:var(--fg)}
.help{font-size:12px;color:var(--dim);line-height:1.6}
.help kbd{font-family:var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--fg);font-size:11px}

/* ---------- FIELD ---------- */
#field{position:fixed;inset:0;background:#000}
#cv{position:absolute;inset:0}
#cv canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;font-size:12px}
#hud .pe{pointer-events:auto}
.hbar{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;justify-content:space-between;align-items:flex-start;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;flex-wrap:wrap}
.hstat{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:rgba(10,13,16,.78);border:1px solid var(--line);padding:5px 9px;border-radius:3px;backdrop-filter:blur(4px);white-space:nowrap}
.pill b{font-family:var(--disp);font-size:16px;letter-spacing:.04em}
.pill.mode b{color:var(--amber)}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hbtns .btn{background:rgba(20,25,30,.85);min-height:34px}
.hbtns .btn.primary{background:var(--amber)}
.hbtns .btn.on{border-color:var(--amber);color:var(--amber)}
#sq{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.uc{background:rgba(10,13,16,.82);border:1px solid var(--line);border-radius:3px;padding:6px 8px;min-width:118px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left}
.uc .n{display:flex;justify-content:space-between;gap:8px;font-family:var(--disp);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.uc .s{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.uc.sel{border-color:var(--amber)}
.uc.pos{border-color:var(--amber);background:rgba(58,40,10,.85)}
.uc.dead{opacity:.45}
.uc .key{color:var(--dim);font-family:var(--mono);font-size:10px}
#xhair{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}
#xhair:before,#xhair:after{content:"";position:absolute;background:rgba(240,235,220,.85)}
#xhair:before{left:10px;top:0;width:2px;height:7px;box-shadow:0 15px 0 rgba(240,235,220,.85)}
#xhair:after{top:10px;left:0;height:2px;width:7px;box-shadow:15px 0 0 rgba(240,235,220,.85)}
#mag{position:absolute;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));text-align:right}
#mag b{font-family:var(--disp);font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
#mag span{color:var(--dim)}
#prompt{position:absolute;left:50%;top:58%;transform:translateX(-50%);text-align:center;font-family:var(--disp);font-size:17px;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 1px 3px #000}
#prog{width:160px;height:4px;background:rgba(255,255,255,.15);margin:6px auto 0;border-radius:2px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--amber)}
#vig{position:absolute;inset:0;box-shadow:inset 0 0 160px 40px rgba(180,20,10,.0);transition:box-shadow .25s}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));color:var(--dim);font-size:11px;text-align:center;white-space:nowrap;text-shadow:0 1px 2px #000}
#tags{position:absolute;inset:0;overflow:hidden}
.ntag{position:absolute;transform:translate(-50%,-100%);font-family:var(--disp);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;padding:1px 5px;border-radius:2px;background:rgba(10,13,16,.75);white-space:nowrap}
#animDbg{position:absolute;left:12px;top:calc(56px + env(safe-area-inset-top,0px));background:rgba(10,13,16,.85);border:1px solid var(--line);border-left:3px solid var(--clear);border-radius:3px;padding:8px 10px;font-size:11px;line-height:1.6;min-width:190px;font-variant-numeric:tabular-nums}
#animDbg b{color:var(--clear);font-weight:500}
#toasts{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;width:min(92vw,520px)}
.toast{background:rgba(10,13,16,.88);border:1px solid var(--line);border-left:3px solid var(--amber);padding:7px 11px;border-radius:3px;font-size:12px;animation:tin .2s ease-out}
@keyframes tin{from{transform:translateY(-6px);opacity:0}}
/* touch */
#touch{position:absolute;inset:0}
#joy{position:absolute;left:24px;bottom:calc(110px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04)}
#joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(227,162,59,.35);border:1px solid var(--amber)}
#tpad{position:absolute;right:14px;bottom:calc(96px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,58px);gap:8px}
.tb{width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:rgba(16,20,24,.8);font-family:var(--disp);font-weight:700;letter-spacing:.04em;font-size:12px;text-transform:uppercase;touch-action:none}
.tb.on{border-color:var(--amber);color:var(--amber)}
.tb.fire{grid-column:span 2;width:auto;border-radius:29px;border-color:var(--amber);color:var(--amber);font-size:15px}
.zbtns{position:absolute;right:12px;top:50%;display:flex;flex-direction:column;gap:6px;transform:translateY(-50%)}
.zbtns .btn{width:40px;padding:0;background:rgba(20,25,30,.85)}

/* ---------- MODAL ---------- */
#modal{position:fixed;inset:0;background:rgba(5,7,9,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.mbox{width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--amber);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:12px}
.mbox h2{font-size:26px;text-transform:uppercase}
.mbox p{margin:0;line-height:1.55}
.radio{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);display:flex;justify-content:space-between}
.quote{border-left:2px solid var(--amber);padding-left:10px;font-size:14px;line-height:1.55}
.cd{height:4px;background:#0a0d10;border-radius:2px;overflow:hidden}
.cd i{display:block;height:100%;background:var(--danger)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px}
.choices .btn{justify-content:flex-start;text-align:left;flex-direction:column;align-items:flex-start;padding:8px 10px;min-height:52px;gap:2px}
.choices .btn small{font-family:var(--mono);font-size:11px;text-transform:none;letter-spacing:0;color:var(--dim);font-weight:400}
.gate{display:flex;flex-direction:column;gap:6px}
.gate .g{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line);padding:8px 10px;border-radius:3px;flex-wrap:wrap}
.gate .g b{font-family:var(--disp);font-size:18px;text-transform:uppercase}
.st-ok{color:var(--clear)} .st-bad{color:var(--danger)}
.tally{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- INTERROGATION ---------- */
#interro{position:fixed;inset:0;overflow:auto;padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));background:radial-gradient(ellipse 60% 45% at 50% 0%,#2a2416 0%,var(--bg) 70%)}
#interro.shake{animation:shk .28s}
@keyframes shk{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
.iwrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.ihead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.ihead h1{font-size:clamp(34px,6vw,52px);text-transform:uppercase;line-height:.95}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.meter{background:var(--panel);border:1px solid var(--line);padding:10px;border-radius:3px}
.meter .l{display:flex;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:6px}
.meter .bar{height:8px;background:#0a0d10;border-radius:2px;overflow:hidden}
.meter .bar i{display:block;height:100%}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:12px;display:flex;flex-direction:column;gap:7px;max-height:300px;overflow:auto;font-size:13px;line-height:1.5}
.dlg .you{color:#c7cdc3} .dlg .them{color:var(--amber);padding-left:14px} .dlg .sys{color:var(--dim);font-style:italic}
.dlg .tell{color:#9fb4e6}
.iacts{display:flex;flex-direction:column;gap:10px}
.iacts h3{font-size:14px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim)}
.iacts .row{display:flex;flex-wrap:wrap;gap:8px}
#cut{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:30;transition:opacity .35s}
#cut.on{opacity:1;transition:none}
@media (prefers-reduced-motion:reduce){#interro.shake{animation:none}.toast{animation:none}}

/* ---------- LOBBY (3D squad line-up, tabbed ops board) ---------- */
#base{overflow:hidden!important;padding:0!important;background:#16120f}
#lcv,#lcv canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
#lshade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(10,9,8,.86) 0,rgba(10,9,8,.55) 30%,rgba(10,9,8,0) 55%),linear-gradient(0deg,rgba(10,9,8,.8) 0,rgba(10,9,8,0) 22%),linear-gradient(180deg,rgba(10,9,8,.75) 0,rgba(10,9,8,0) 20%)}
#ltags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ltag{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:3px;white-space:nowrap;text-shadow:0 1px 3px #000}
.ltag b{font-family:var(--disp);font-size:17px;letter-spacing:.08em;text-transform:uppercase;line-height:1}
.ltag span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#cfd4cb;display:flex;gap:6px;align-items:center}
.ltag i{width:18px;height:3px;border-radius:2px;display:inline-block}
.ltag .hp{width:64px;height:3px;background:rgba(0,0,0,.6);border-radius:2px;overflow:hidden}.ltag .hp u{display:block;height:100%;background:var(--clear)}
#lui{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;pointer-events:none;padding-top:env(safe-area-inset-top,0px)}
#lui button,#lui input,#lui .pe,#lui a{pointer-events:auto}
.ltop{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:18px 24px 0;flex-wrap:wrap}
.logo{font-family:var(--disp);font-weight:700;font-size:46px;line-height:.85;letter-spacing:.05em;text-transform:uppercase;margin:0}
.logo small{display:block;font-size:12px;letter-spacing:.32em;color:var(--amber);font-weight:600;margin-bottom:4px}
.ltabs{display:flex;gap:2px;margin-top:12px;flex-wrap:wrap}
.ltab{background:none;border:0;border-bottom:2px solid transparent;padding:7px 14px 6px;font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);cursor:pointer}
.ltab:hover{color:var(--fg)}
.ltab.on{color:var(--fg);border-bottom-color:var(--amber);background:linear-gradient(0deg,rgba(227,162,59,.16),rgba(227,162,59,0))}
.ltab:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
.pcard{display:flex;gap:12px;align-items:center;background:rgba(12,12,11,.62);border:1px solid rgba(255,255,255,.07);padding:10px 14px 10px 10px;border-radius:3px;backdrop-filter:blur(6px)}
.pcard .em{width:54px;height:54px;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:22px;line-height:.9;text-align:center;border-radius:2px}
.pcard .em small{display:block;font-size:10px;letter-spacing:.14em}
.pcard .nm{font-family:var(--disp);font-size:20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.pcard .rs{display:flex;gap:10px;margin-top:5px;flex-wrap:wrap}
.pcard .rs span{font-size:11px;color:var(--dim);letter-spacing:.06em}.pcard .rs b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}.pcard .rs .low b{color:var(--danger)}
.lmid{display:flex;padding:18px 24px;min-height:0;gap:16px}
.lpanel{width:min(400px,100%);display:flex;flex-direction:column;gap:6px;overflow:auto;max-height:100%;padding-right:4px;scrollbar-width:thin}
.lpanel.wide{width:min(600px,100%)}
.mode{display:block;width:100%;text-align:left;background:rgba(14,14,13,.7);border:1px solid rgba(255,255,255,.06);border-radius:2px;padding:13px 16px;cursor:pointer;color:var(--fg);backdrop-filter:blur(6px)}
.mode h3{font-size:21px;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mode h3 em{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.12em;padding:2px 6px;border:1px solid currentColor;border-radius:2px;opacity:.8}
.mode:hover{border-color:rgba(227,162,59,.6)}
.mode.on{background:linear-gradient(90deg,rgba(227,162,59,.97),rgba(212,148,48,.86));color:var(--amber-ink);border-color:var(--amber)}
.mode p{margin:6px 0 0;font-size:12px;line-height:1.45}
.mode .fill{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid rgba(26,18,6,.25);font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.deploybtn{margin-top:10px;min-height:54px;font-size:22px;letter-spacing:.16em}
.lfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 24px calc(14px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--dim);flex-wrap:wrap}
.lfoot kbd,.kbdc{font-family:var(--mono);font-size:10px;border:1px solid var(--line);background:rgba(0,0,0,.4);padding:1px 5px;border-radius:2px;color:var(--fg)}
.lfoot button{background:none;border:0;color:var(--dim);cursor:pointer;font:inherit;letter-spacing:.08em;text-transform:uppercase;padding:4px}
.lfoot button:hover{color:var(--fg)}
.lpanel .panel{background:rgba(18,19,19,.82);backdrop-filter:blur(6px)}
.evt{position:absolute;left:50%;top:22px;transform:translateX(-50%);font-family:var(--disp);font-weight:700;letter-spacing:.18em;font-size:13px;text-transform:uppercase;background:var(--clear);color:#0b1714;padding:3px 10px;border-radius:2px}
/* creator */
.cre{display:flex;flex-direction:column;gap:12px;background:rgba(14,14,13,.78);border:1px solid rgba(255,255,255,.06);padding:14px;border-radius:3px;backdrop-filter:blur(6px)}
.cre h2{font-size:22px;text-transform:uppercase;letter-spacing:.06em}
.cre .grp{display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--line);padding-top:10px}
.cre .grp>div:first-child{display:flex;justify-content:space-between;align-items:center;font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase}
.roster{display:flex;gap:6px;flex-wrap:wrap}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:2px;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.sw button.on{border-color:var(--amber);box-shadow:0 0 0 1px #000 inset}
.sw button:focus-visible{outline:2px solid var(--fg);outline-offset:1px}
.tog{min-height:26px!important;font-size:12px!important;padding:0 10px!important}
.cre input[type=text]{background:#0c0e10;border:1px solid var(--line);color:var(--fg);font-family:var(--disp);font-size:20px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:2px;width:100%}
.cre input[type=range]{width:100%;accent-color:var(--amber)}
.hintr{font-size:11px;color:var(--dim)}
@media (max-width:760px){
  .ltop{padding:12px 16px 0}.logo{font-size:34px}.pcard{display:none}
  .lmid{padding:10px 16px;align-items:flex-end}
  .lpanel,.lpanel.wide{width:100%;max-height:54vh}
  .lfoot{padding:0 16px calc(10px + env(safe-area-inset-bottom,0px))}
  #lshade{background:linear-gradient(0deg,rgba(10,9,8,.92) 0,rgba(10,9,8,.6) 45%,rgba(10,9,8,0) 70%),linear-gradient(180deg,rgba(10,9,8,.8) 0,rgba(10,9,8,0) 22%)}
  #ltags{display:none}
}
</style>

  <div id="hud">

    <div id="animDbg" hidden></div>
    <div id="xhair" hidden></div>
    <div id="prompt" hidden><span id="promptT"></span><div id="prog"><i></i></div></div>
    <div id="mag" hidden><b id="magN">30</b><br><span id="magS"></span></div>
    <div id="hint"></div>
    <div id="sq" class="pe"></div>
    <div id="labBar" class="pe" hidden style="position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="labBack">Back to safehouse</button><button class="btn" id="labNext">Next character</button></div>
    <div id="touch" hidden>
      <div id="joy" class="pe"><i></i></div>
      <div id="tpad" class="pe">
        <button class="tb" id="tUse">Use</button><button class="tb" id="tKick">Kick</button><button class="tb" id="tRel">Rld</button>
        <button class="tb" id="tCrouch">Crch</button><button class="tb" id="tVault">Vault</button><button class="tb" id="tAim">Aim</button>
        <button class="tb" id="tCover">Cover</button><button class="tb" id="tSwap">Swap</button><button class="tb fire" id="tFire">Fire</button>

  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/meshopt_decoder.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/math/Capsule.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/math/Octree.js"></script>
<script>
(()=>{
'use strict';
const T=THREE, TILE=2, N=52, WALLH=3.2;
const $=s=>document.querySelector(s);
const RANKS=['','Civilian','Militia','Trained','Veteran','Spec Ops'];
const ACC=[0,.42,.55,.67,.78,.88];
const GEAR=[null,
  {n:'Scavenged',dmg:24,rof:.30,arm:0},
  {n:'Militia kit',dmg:30,rof:.20,arm:.12},
  {n:'Tactical',dmg:36,rof:.14,arm:.25},
  {n:'Spec-Ops',dmg:44,rof:.10,arm:.40}];
const TEAM=['#e3a23b','#5fb3a1','#a796e0','#d9806a'];
const NAMES=['Diaz','Kowal','Mercer','Ito','Brandt','Sato','Nwosu','Quinn','Lark','Petrov','Abara','Holt','Ferro','Yates','Cruz','Doyle','Mbeki','Varga'];
const ROLES=['Rifleman','Scout','Medic','Breacher','Marksman'];
const KINDS=['res','pharm','store','police','ware'];
const KNAME={res:'apartment',pharm:'pharmacy',store:'corner store',police:'police annex',ware:'warehouse'};
const KTINT={res:0x3a3530,pharm:0x2f3a38,store:0x3a3428,police:0x2c3240,ware:0x33332f};
const KWALL={res:0x6d6458,pharm:0x5d6a66,store:0x6e6450,police:0x56606e,ware:0x5e5d55};
const MED_P=[.15,.6,.9];
let uidc=(Date.now()%100000); const uid=()=>'u'+(uidc++);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let R=Math.random;
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=a=>a[Math.floor(R()*a.length)];
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= SAVE / STATE ================= */
const KEY='holdout-save-v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}}
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
function mk(name,role,rank){return{id:uid(),name,role,rank,hp:100,infected:false,spy:false}}
function newGame(){return{day:1,food:14,meds:4,ammo:260,parts:8,morale:70,rep:0,grudge:0,
  up:{med:0,arm:1,cell:0},
  squad:[mk('Reyes','Medic',2),mk('Okafor','Point',2),mk('Hale','Marksman',2),mk('Vance','Breacher',1)],
  prisoners:[],intel:[],trade:false,cacheMarked:null,
  log:['D1 · The radio tower still works. Four of us left. Supplies for a few days.']}}
const hot=window.claude&&window.claude.hot;
let G=(hot&&hot.data&&hot.data.G)||load()||newGame();
try{hot&&hot.snapshot&&hot.snapshot(()=>({G}))}catch(e){}
function log(s){G.log.unshift('D'+G.day+' · '+s);G.log=G.log.slice(0,40)}
let deploySel=new Set();
function defaultSel(){deploySel=new Set(G.squad.filter(s=>s.hp>25).slice(0,4).map(s=>s.id))}
defaultSel();

/* ================= AUDIO ================= */
let AC=null,noiseBuf=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}return AC}
function snd(vol,freq,len){const a=ac();if(!a)return;try{
  if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*.3,a.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const s=a.createBufferSource();s.buffer=noiseBuf;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;
  const g=a.createGain();const t=a.currentTime;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+len);
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+len+.02)}catch(e){}}

/* ================= BASE UI ================= */
const COST={
  med:[{parts:6,meds:2},{parts:12,meds:3}],
  arm:[null,{parts:8},{parts:14},{parts:22}],
  cell:{parts:5}
};
const trainCost=r=>({parts:2*r+1,food:2*r});
function can(c){return Object.keys(c).every(k=>G[k]>=c[k])}
function pay(c){for(const k in c)G[k]-=c[k]}
function costTxt(c){return Object.entries(c).map(([k,v])=>v+' '+k).join(' · ')}
function lvl(n,max){let s='<span class="lvl">';for(let i=0;i<max;i++)s+=`<i class="${i<n?'f':''}"></i>`;return s+'</span>'}
function hpCls(h){return h>60?'':h>30?'mid':'lo'}

let LTAB='play',LSEL=null;
const SECTORS=[
  {id:'bridge',n:'River Crossing',tag:'Bridges',d:'Three bridges over the river: a road span with an army checkpoint, a collapsed span, a timber footbridge. Loot on both banks.'},
  {id:'city',n:'Downtown',tag:'Interiors',d:'Dense city blocks. Every building can be entered and searched. Close quarters.'},
  {id:'metro',n:'Metro',tag:'New map',d:'A real city crossroads: brick and concrete towers, storefronts, paving, wrecked traffic. Loads when you deploy.',need:()=>METRO!==false},
];
function renderBase(){
  const b=$('#lui');
  if(!G.squad.length){
    b.innerHTML=`<div></div><div class="lmid"><div class="lpanel"><section class="panel pe"><div class="eyebrow">Signal lost</div><h2>The safehouse went quiet</h2><p>Nobody is left to work the radio. You lasted ${G.day} days.</p><div><button class="btn primary" data-act="newgame">Start a new holdout</button></div></section></div></div><div></div>`;
    lobbySync();return;
  }
  if(!LSEL||!G.squad.some(x=>x.id===LSEL))LSEL=G.squad[0].id;
  const g=GEAR[G.up.arm];
  const res=[['Food',G.food,G.food<G.squad.length+G.prisoners.length],['Meds',G.meds],['Ammo',G.ammo,G.ammo<60],['Parts',G.parts],['Morale',G.morale+'%',G.morale<40]]
    .map(([n,v,low])=>`<span class="${low?'low':''}">${n} <b>${v}</b></span>`).join('');
  const team=G.squad.filter(x=>deploySel.has(x.id)&&x.hp>0);
  const sec=G.sector||'bridge';
  const tabs=[['play','Play'],['squad','Squad'],['ops','Operators'],['base','Base'],['intel','Intel'],['log','Log']]
    .map(([k,n])=>`<button class="ltab ${LTAB===k?'on':''}" data-act="tab" data-id="${k}" aria-pressed="${LTAB===k}">${n}</button>`).join('');
  let body='';
  if(LTAB==='play'){
    body=`<div class="lpanel">`+SECTORS.map(x=>{const on=sec===x.id,ok=!x.need||x.need();
      return `<button class="mode ${on?'on':''}" data-act="sector" data-id="${x.id}" ${ok?'':'disabled style="opacity:.45"'} aria-pressed="${on}"><h3>${x.n}<em>${ok?x.tag:'Loading'}</em></h3>${on?`<p>${x.d}</p><div class="fill"><span>Squad</span><span>${team.length} / 4</span></div>`:''}</button>`}).join('')+
      `<button class="mode" data-act="rest"><h3>Rest a day<em>+20 HP</em></h3></button>
       <button class="btn primary deploybtn" data-act="deploy">Deploy</button>
       <div class="hintr">Each day eats 1 food per person. Gear: ${g.n}.</div></div>`;
  }else if(LTAB==='squad'){
    const cards=G.squad.map(s=>{const on=deploySel.has(s.id),tc=trainCost(s.rank);
      return `<article class="card ${on?'on':''}"><div class="top"><span class="nm">${esc(s.name)}</span><span class="chip rk">${RANKS[s.rank]}</span></div>
      <div class="dim">${esc(s.role)} · HP ${Math.round(s.hp)}</div><div class="hpbar"><i class="${hpCls(s.hp)}" style="width:${s.hp}%"></i></div>
      <div class="row"><button class="btn sm ${on?'primary':''}" data-act="sel" data-id="${s.id}" aria-pressed="${on}">${on?'Deploying':'Bench'}</button>
      <button class="btn sm" data-act="heal" data-id="${s.id}" ${s.hp>=100||G.meds<1?'disabled':''}>Heal <span class="cost">1 med</span></button>
      ${s.rank<5?`<button class="btn sm" data-act="train" data-id="${s.id}" ${can(tc)?'':'disabled'}>Train <span class="cost">${costTxt(tc)}</span></button>`:''}
      <button class="btn sm" data-act="opsel" data-id="${s.id}">Customize</button></div></article>`}).join('');
    body=`<div class="lpanel wide"><section class="panel"><h2>Squad <span class="dim">${G.squad.length}/6 on roster · up to 4 deploy</span></h2><div class="squad">${cards}</div></section></div>`;
  }else if(LTAB==='ops'){
    const s=G.squad.find(x=>x.id===LSEL),L=lookOf(s);
    const sw=(k,pal,cur)=>`<div class="sw">${pal.map((c,i)=>`<button class="${(cur||0)===i?'on':''}" style="background:#${swHex(k,c).toString(16).padStart(6,'0')}" data-act="look" data-k="${k}" data-v="${i}" aria-label="${k} ${i+1}" aria-pressed="${(cur||0)===i}"></button>`).join('')}</div>`;
    const tg=k=>`<button class="btn sm tog ${L[k]?'primary':''}" data-act="lookT" data-k="${k}" aria-pressed="${!!L[k]}">${L[k]?'On':'Off'}</button>`;
    body=`<div class="lpanel"><div class="cre">
      <div class="roster">${G.squad.map(x=>`<button class="btn sm ${x.id===LSEL?'primary':''}" data-act="opsel" data-id="${x.id}">${esc(x.name)}</button>`).join('')}</div>
      <div><div class="eyebrow">${esc(s.role)} · ${RANKS[s.rank]}</div><input type="text" maxlength="14" value="${esc(s.name)}" data-k="name" aria-label="Callsign"></div>
      <div class="grp"><div><span>Presets</span></div><div class="row" style="display:flex;gap:6px;flex-wrap:wrap">${Object.keys(CAMO).map(k=>`<button class="btn sm" data-act="preset" data-id="${k}">${k}</button>`).join('')}<button class="btn sm" data-act="rand">Random</button></div></div>
      <div class="grp"><div><span>Cap</span>${tg('cap')}</div>${L.cap?sw('capC',LOOK_SW.cap,L.capC):''}</div>
      <div class="grp"><div><span>Shirt</span></div>${sw('shirt',LOOK_SW.shirt,L.shirt)}</div>
      <div class="grp"><div><span>Pants</span></div>${sw('pants',LOOK_SW.pants,L.pants)}</div>
      <div class="grp"><div><span>Plate carrier</span>${tg('vest')}</div>${L.vest?sw('vestC',LOOK_SW.vest,L.vestC):''}</div>
      <div class="grp"><div><span>Pouches</span>${tg('drops')}</div><div style="display:flex;justify-content:space-between;align-items:center;font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase"><span>Thigh holster</span>${tg('holster')}</div>${L.drops||L.holster?sw('gear',LOOK_SW.gear,L.gear):''}</div>
      <div class="grp"><div><span>Skin</span></div>${sw('skin',LOOK_SW.skin,L.skin)}</div>
      <div class="grp"><div><span>Build</span><span class="dim" style="font-family:var(--mono);font-size:11px">${Math.round((L.height||1)*100)}%</span></div><input type="range" min="94" max="106" value="${Math.round((L.height||1)*100)}" data-k="height" aria-label="Build"></div>
      <div class="hintr">Drag the operator to turn them. Saved to this squad member.</div></div></div>`;
  }else if(LTAB==='base'){
    const medNext=COST.med[G.up.med],armNext=COST.arm[G.up.arm];
    const pris=G.prisoners.length?G.prisoners.map(p=>`<div class="item"><p><b>${esc(p.name)}</b> <span class="dim">· ${p.injury>40?'injured · ':''}${p.sessionDay===G.day?'questioned today':'ready'}</span></p>
      <button class="btn sm" data-act="interro" data-id="${p.id}" ${G.up.cell<1||p.sessionDay===G.day?'disabled':''}>Interrogate</button></div>`).join(''):`<p class="dim">No prisoners. Raiders who surrender in the field can be brought back.</p>`;
    body=`<div class="lpanel wide"><section class="panel"><h2>Facilities</h2><div class="fac">
      <div class="f"><div><h3>Med bay ${lvl(G.up.med,2)}</h3><p>Gate scan catches ${Math.round(MED_P[G.up.med]*100)}% of hidden bites.</p></div>
        ${medNext?`<button class="btn sm" data-act="upMed" ${can(medNext)?'':'disabled'}>Upgrade <span class="cost">${costTxt(medNext)}</span></button>`:'<span class="chip">Max</span>'}</div>
      <div class="f"><div><h3>Armory ${lvl(G.up.arm,4)}</h3><p>${g.n}: ${g.dmg} dmg, ${Math.round(g.arm*100)}% armor.</p></div>
        ${armNext?`<button class="btn sm" data-act="upArm" ${can(armNext)?'':'disabled'}>Upgrade <span class="cost">${costTxt(armNext)}</span></button>`:'<span class="chip">Max</span>'}</div>
      <div class="f"><div><h3>Holding cell ${lvl(G.up.cell,1)}</h3><p>${G.up.cell?'Prisoners can be held and questioned.':'Without it, prisoners slip out overnight.'}</p></div>
        ${G.up.cell?'<span class="chip">Built</span>':`<button class="btn sm" data-act="upCell" ${can(COST.cell)?'':'disabled'}>Build <span class="cost">${costTxt(COST.cell)}</span></button>`}</div>
      ${G.trade?`<div class="f"><div><h3>Trade route</h3><p>Settlement contact confirmed.</p></div><div class="row" style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn sm" data-act="trade1" ${G.parts<4?'disabled':''}>3 meds <span class="cost">4 parts</span></button>
        <button class="btn sm" data-act="trade2" ${G.food<3?'disabled':''}>40 ammo <span class="cost">3 food</span></button></div></div>`:''}
      </div></section><section class="panel"><h2>Holding cell <span class="dim">${G.prisoners.length} held</span></h2><div class="list">${pris}</div></section></div>`;
  }else if(LTAB==='intel'){
    const intel=G.intel.length?G.intel.slice().reverse().map(it=>{
      const st={new:['new','Unverified'],marked:['mark','Marked for next run'],ok:['ok','Confirmed'],bad:['bad','False'],trap:['bad','Ambush']}[it.status];let btn='';
      if(it.status==='new'&&it.topic==='settle')btn=`<button class="btn sm" data-act="runner" data-id="${it.id}" ${G.food<2?'disabled':''}>Send runner <span class="cost">2 food</span></button>`;
      if(it.status==='new'&&it.topic==='cache')btn=`<button class="btn sm" data-act="mark" data-id="${it.id}">Mark for next run</button>`;
      return `<div class="item"><p><span class="tag ${st[0]}">${st[1]}</span>${esc(it.text)} <span class="dim">· from ${esc(it.from)}</span></p>${btn}</div>`}).join(''):`<p class="dim">Nothing yet. Prisoners know things. Some of it is true.</p>`;
    body=`<div class="lpanel wide"><section class="panel"><h2>Intel board</h2><div class="list">${intel}</div></section></div>`;
  }else{
    body=`<div class="lpanel wide"><section class="panel"><h2>Radio log</h2><ol class="log">${G.log.map(l=>`<li>${esc(l)}</li>`).join('')}</ol></section>
    <section class="panel"><h2>Field controls</h2><div class="help">
      <b>Overwatch</b>: click a squad member, then click the ground to move them. Nobody selected moves everyone. <kbd>WASD</kbd> pan, wheel zoom, <kbd>1</kbd>–<kbd>4</kbd> select, <kbd>H</kbd> hold fire.<br>
      <b>Take control</b> (<kbd>Tab</kbd>): first person. Click to lock the mouse. <kbd>LMB</kbd> fire, <kbd>RMB</kbd> aim, <kbd>Shift</kbd> sprint, <kbd>C</kbd> crouch (at a sprint it slides), <kbd>Space</kbd> vault or jump, <kbd>Q</kbd> cover, <kbd>F</kbd> kick, <kbd>X</kbd> swap AKS-74U / Mark 23, <kbd>B</kbd> auto/semi, <kbd>E</kbd> search, <kbd>R</kbd> reload.<br>
      On a phone: joystick left, drag right side to look.</div></section>
    <section class="panel"><h2>Graphics</h2><div class="deploy"><span class="dim">Textures</span>
      <button class="btn sm ${TEXQ!=='ultra'?'primary':''}" data-act="texq" data-id="high">High · 2K</button>
      <button class="btn sm ${TEXQ==='ultra'?'primary':''}" data-act="texq" data-id="ultra" ${WEB?'':'disabled'}>Ultra · 4K</button></div>
      <p class="dim">${WEB?'Ultra streams 4K operator and surface textures after the 2K ones appear. Needs a dedicated GPU; if memory runs out the game drops back to High automatically.':'Ultra (4K) is available on the web build.'}</p></section>
    <section class="panel" id="credits"><h2>Credits</h2><p class="dim">Operators: "Modular Casual Soldier" kit · Survivalist by Slayver (CGTrader) · Viewmodels: "Animated AKs-74u" by Vlasov Daniil (CC BY 4.0), "Mark 23 Animated (Free)" by BarcodeGames / notatree · zombie + rifle animations: Mixamo · city kit, cars, props, Nature Kit: Kenney (CC0) · textures: ambientCG (CC0) · rusty cars + Metro district: user-supplied packs.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="lab">Anim Lab</button><button class="btn danger sm" data-act="reset">Wipe save</button></div></section></div>`;
  }
  const evt=G.cacheMarked?'Cache marked':team.length<4&&G.squad.length>=4?'Squad not full':'';

    case'upMed':{const c=COST.med[G.up.med];if(c&&can(c)){pay(c);G.up.med++;log(`Med bay upgraded. Scanner catches ${MED_P[G.up.med]*100}% of bites.`)}}break;

    case'trade2':if(G.food>=3){G.food-=3;G.ammo+=40;log('Traded 3 food for 40 rounds.')}break;

      t.disabled=true;t.textContent=G.sector==='metro'&&!METRO?'Loading Metro…':'Loading…';ensureAnims().then(()=>G.sector==='metro'?ensureMetro():0).then(()=>startMission(team));return}

    case'opsel':LSEL=id;LTAB='ops';break;

    case'lookT':{const sx=G.squad.find(x=>x.id===LSEL);if(sx){const L=lookOf(sx);L[t.dataset.k]=!L[t.dataset.k];lobbyLook(sx)}}break;
    case'preset':{const sx=G.squad.find(x=>x.id===LSEL);if(sx){Object.assign(lookOf(sx),CAMO[id]);lobbyLook(sx)}}break;
    case'rand':{const sx=G.squad.find(x=>x.id===LSEL);if(sx){const L=lookOf(sx),rr=a=>Math.floor(Math.random()*a.length);
      Object.assign(L,{cap:Math.random()<.6,vest:Math.random()<.8,drops:Math.random()<.7,holster:Math.random()<.6,capC:rr(LOOK_SW.cap),shirt:rr(LOOK_SW.shirt),pants:rr(LOOK_SW.pants),vestC:rr(LOOK_SW.vest),gear:rr(LOOK_SW.gear),skin:rr(LOOK_SW.skin),height:.95+Math.random()*.1});lobbyLook(sx)}}break;
    case'interro':openInterro(id);return;

function runner(id){
  const it=G.intel.find(x=>x.id===id);if(!it||G.food<2)return;
  G.food-=2;
  if(it.truth){it.status='ok';G.trade=true;log(`Runner found the settlement at ${it.place}. Trade route open.`)}
  else{it.status='bad';
    if(R()<.4&&G.squad.length){const v=pick(G.squad);v.hp=Math.max(5,v.hp-35);log(`Runner walked into nothing at ${it.place}. ${v.name} got hurt on the way back.`)}
    else log(`Nothing at ${it.place}. ${it.from} lied.`)}
}

function endDay(msg){
  if(msg)log(msg);
  const mouths=G.squad.length+G.prisoners.length;
  G.food-=mouths;
  if(G.food<0){G.food=0;G.morale=clamp(G.morale-12,0,100);G.squad.forEach(s=>s.hp=Math.max(5,s.hp-10));log('Not enough food. Everyone went to bed hungry.')}
  // turned overnight
  const turned=G.squad.filter(s=>s.infected);
  for(const s of turned){
    G.squad=G.squad.filter(x=>x!==s);
    let extra='';
    if(G.squad.length&&R()<.35){const v=pick(G.squad);G.squad=G.squad.filter(x=>x!==v);extra=` ${v.name} was killed before anyone could stop it.`}
    G.morale=clamp(G.morale-18,0,100);
    log(`${s.name} turned in the barracks overnight.${extra}`);
  }
  // spies
  for(const s of G.squad.filter(x=>x.spy)){
    if(R()<.25){G.squad=G.squad.filter(x=>x!==s);G.parts=Math.max(0,G.parts-3);G.food=Math.max(0,G.food-3);log(`${s.name} vanished before dawn with 3 parts and 3 food. Never really one of us.`)}
  }
  // prisoners
  for(const p of G.prisoners.slice()){
    if(p.infected){G.prisoners=G.prisoners.filter(x=>x!==p);log(`${p.name} turned in the cell. The door held.`);continue}
    if(!G.up.cell){G.prisoners=G.prisoners.filter(x=>x!==p);G.grudge+=p.hurt?1:0;log(`${p.name} slipped out overnight. No cell to hold them.`);continue}
    p.pressure=Math.round(p.pressure*.5);p.trust=Math.max(0,p.trust-3);p.injury=Math.max(0,p.injury-10);
  }
  if(G.grudge>0&&R()<.3){G.grudge--;G.food=Math.max(0,G.food-3);G.parts=Math.max(0,G.parts-2);G.morale=clamp(G.morale-6,0,100);log('Raiders hit the fence at night. Someone we let go showed them the way in.')}
  G.morale=clamp(G.morale+(G.morale<60?3:0),0,100);
  G.day++;
  deploySel=new Set([...deploySel].filter(id=>G.squad.some(s=>s.id===id)));
  if(!deploySel.size)defaultSel();
  save();
}

    b.hand_r.getWorldPosition(_TR);if(b.middle_01_r){b.middle_01_r.getWorldPosition(_A);_TR.lerp(_A,.55)}
    b.hand_l.getWorldPosition(_TL);if(b.middle_01_l){b.middle_01_l.getWorldPosition(_B);_TL.lerp(_B,.55)}
    _V1.subVectors(_TL,_TR);const dl=_V1.length();
    if(dl>.05){_V1.multiplyScalar(1/dl);_V2.set(0,1,0).addScaledVector(_V1,-_V1.y).normalize();_TX.crossVectors(_V2,_V1);
      _M1.makeBasis(_TX,_V2,_V1);_QW.setFromRotationMatrix(_M1);
      _A.copy(r.grip.position).applyQuaternion(_QW);_B.copy(_TR).sub(_A);
      r.root.getWorldQuaternion(_QP);r.rifle.quaternion.copy(_QP.invert().multiply(_QW));r.rifle.position.copy(r.root.worldToLocal(_B))}
  }else if(r.kind==='op'){
    const p=RPOSE[r.rState]||RPOSE.low;
    r.rp=r.rp||p.slice();for(let i=0;i<5;i++)r.rp[i]+=(p[i]-r.rp[i])*.25;
    r.rifle.position.set(r.rp[0],r.rp[1],r.rp[2]);r.rifle.rotation.set(r.rp[3],r.rp[4],0);
    r.chest.updateMatrixWorld(true);
    if(r.ikW>.02){
      const keep=r.ikW<.98?[b.upperarm_r,b.lowerarm_r,b.upperarm_l,b.lowerarm_l].map(x=>x.quaternion.clone()):null;
      r.grip.getWorldPosition(_TR);r.guard.getWorldPosition(_TL);b.spine_03.getWorldPosition(_CH);
      _PR.copy(_CH).addScaledVector(_LEFT,-.55).add(new T.Vector3(0,-.45,0));
      _PL.copy(_CH).addScaledVector(_LEFT,.5).add(new T.Vector3(0,-.5,0));
      ik2(b.upperarm_r,b.lowerarm_r,b.hand_r,_TR,_PR);
      ik2(b.upperarm_l,b.lowerarm_l,b.hand_l,_TL,_PL);
      if(keep){[b.upperarm_r,b.lowerarm_r,b.upperarm_l,b.lowerarm_l].forEach((x,i)=>{keep[i].slerp(x.quaternion,r.ikW);x.quaternion.copy(keep[i])})}
    }
  }else if(c.hu>.05&&r.chest){
    b.spine_03.getWorldPosition(_CH);
    _TR.copy(_CH).addScaledVector(_LEFT,-.22).addScaledVector(_FWD,.08);_TR.y+=.5;
    _TL.copy(_CH).addScaledVector(_LEFT,.22).addScaledVector(_FWD,.08);_TL.y+=.5;
    _PR.copy(_CH).addScaledVector(_LEFT,-.8);_PL.copy(_CH).addScaledVector(_LEFT,.8);
    ik2(b.upperarm_r,b.lowerarm_r,b.hand_r,_TR,_PR);ik2(b.upperarm_l,b.lowerarm_l,b.hand_l,_TL,_PL);
  }  if(r.dress){followDress(r);
    if(r.rl&&r.rifle&&r.dress.b.hand_r){b.hand_r.getWorldPosition(_A);r.dress.b.hand_r.getWorldPosition(_B);_B.sub(_A);r.rifle.position.add(_B.applyQuaternion(r.root.getWorldQuaternion(_QP).invert()))}}
}

/* ================= FX: blood + brass ================= */
const FXP=[];
function initFX(){
  const bm=new T.MeshBasicMaterial({color:0x6e0b07});
  const brm=new T.MeshStandardMaterial({color:0xc9a243,metalness:.7,roughness:.35});
  for(let i=0;i<180;i++){const m=new T.Mesh(bx(.05,.05,.05),bm);m.visible=false;scene.add(m);FXP.push({m,life:0,v:new T.Vector3(),k:0})}
  for(let i=0;i<40;i++){const m=new T.Mesh(cyl(.011,.045),brm);m.visible=false;scene.add(m);FXP.push({m,life:0,v:new T.Vector3(),k:1})}
}
function emit(k,x,y,z,vx,vy,vz,life){for(const p of FXP){if(p.k!==k||p.life>0)continue;p.life=life;p.max=life;p.m.position.set(x,y,z);p.v.set(vx,vy,vz);p.m.visible=true;p.m.scale.setScalar(1);return}}
function blood(x,y,z,dx,dz,n){for(let i=0;i<n;i++)emit(0,x,y,z,dx*(1+Math.random()*2.5)+(Math.random()-.5)*1.6,Math.random()*2.2,dz*(1+Math.random()*2.5)+(Math.random()-.5)*1.6,.5+Math.random()*.4)}
function updFX(dt){for(const p of FXP){if(p.life<=0)continue;p.life-=dt;p.v.y-=9.8*dt;p.m.position.addScaledVector(p.v,dt);
  if(p.m.position.y<.03){p.m.position.y=.03;if(p.k===1){p.v.y*=-.35;p.v.x*=.5;p.v.z*=.5}else p.v.set(0,0,0)}
  if(p.k===0)p.m.scale.setScalar(Math.max(.2,p.life/p.max)*1.3);else{p.m.rotation.x+=dt*14;p.m.rotation.z+=dt*9}
  if(p.life<=0)p.m.visible=false}}
function clearFX(){for(const p of FXP){p.life=0;p.m.visible=false}}

/* ================= WORLD GEN ================= */
const idx=(x,y)=>y*N+x;
/* River Crossing sector: tiles x 20..31 are river (5 = water/bank, impassable, see-through).
   y 16..19 road bridge · y 32..35 collapsed bridge (stubs 3 tiles each side) · y 41..42 timber footbridge */
const RIVER={x0:20,x1:31,road:[16,19],broke:[32,35],foot:[41,42],stub:3};
function genWorld(seed,sector){
  R=mulberry(seed);
  const grid=new Uint8Array(N*N), kmap=new Uint8Array(N*N);
  const conts=[],npcs=[],zsp=[],blds=[],low=[],cars=[];const gaps=new Set();
  const B=[4,20,36];
  const set=(x,y,v)=>{grid[idx(x,y)]=v};
  function building(x0,y0,w,h,kind,side){
    const ki=KINDS.indexOf(kind)+1;
    for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++){set(x,y,(x===x0||y===y0||x===x0+w-1||y===y0+h-1)?1:2);kmap[idx(x,y)]=ki}
    let mx=-1,my=-1;
    if(h>=8){
      my=y0+Math.floor(h/2);mx=x0+Math.floor(w/2);
      for(let x=x0+1;x<x0+w-1;x++)set(x,my,1);
      let gx;do{gx=x0+ri(1,w-2)}while(gx===mx);set(gx,my,2);gaps.add(idx(gx,my));
      const top=R()<.5;const ya=top?y0:my,yb=top?my:y0+h-1;
      for(let y=ya+1;y<yb;y++)set(mx,y,1);
      const gy=ri(ya+1,yb-1);set(mx,gy,2);gaps.add(idx(mx,gy));
    }else{
      mx=x0+ri(4,5);
      for(let y=y0+1;y<y0+h-1;y++)set(mx,y,1);
      const gy=ri(y0+1,y0+h-2);set(mx,gy,2);gaps.add(idx(mx,gy));
    }
    let dx,dy;
    if(side==='n'||side==='s'){dy=side==='n'?y0:y0+h-1;do{dx=x0+ri(1,w-2)}while(dx===mx)}
    else{dx=side==='w'?x0:x0+w-1;do{dy=y0+ri(1,h-2)}while(dy===my)}
    set(dx,dy,2);gaps.add(idx(dx,dy));
    const nearGap=(x,y)=>{for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)if(gaps.has(idx(x+i,y+j)))return true;return false};
    const interior=[];
    for(let y=y0+1;y<y0+h-1;y++)for(let x=x0+1;x<x0+w-1;x++)if(grid[idx(x,y)]===2)interior.push([x,y]);
    const cand=interior.filter(([x,y])=>!nearGap(x,y)&&(grid[idx(x+1,y)]===1||grid[idx(x-1,y)]===1||grid[idx(x,y+1)]===1||grid[idx(x,y-1)]===1));
    for(let i=cand.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[cand[i],cand[j]]=[cand[j],cand[i]]}
    const want=h>=8?ri(3,5):ri(2,3);let placed=0;
    for(const [x,y] of cand){
      if(placed>=want)break;
      let clash=false;for(const c of conts)if(Math.abs(c.tx-x)<=1&&Math.abs(c.ty-y)<=1)clash=true;
      if(clash)continue;
      set(x,y,3);conts.push({tx:x,ty:y,kind,looted:false,special:false});placed++;
    }
    const free=()=>{for(let k=0;k<30;k++){const [x,y]=pick(interior);if(grid[idx(x,y)]===2&&!nearGap(x,y))return[x,y]}return null};
    if(R()<.42){const f=free();if(f)npcs.push({tx:f[0],ty:f[1],type:R()<.62?'surv':'raider'})}
    const zn=ri(1,3);for(let k=0;k<zn;k++){const f=free();if(f)zsp.push(f)}
    blds.push({x0,y0,w,h,kind,interior});
  }
  const RIV=sector==='bridge';
  for(const by of B)for(const bx0 of B){
    if(RIV&&bx0===20)continue;
    if(R()<.5)building(bx0+1,by+1,10,10,pick(KINDS),pick(['n','s','e','w']));
    else{building(bx0+1,by+1,10,5,pick(KINDS),'n');building(bx0+1,by+6,10,5,pick(KINDS),'s')}
  }
  if(RIV){const{x0,x1,road,broke,foot,stub}=RIVER;
    for(let y=0;y<N;y++)for(let x=x0;x<=x1;x++){
      const deck=(y>=road[0]&&y<=road[1])||(y>=foot[0]&&y<=foot[1])||(y>=broke[0]&&y<=broke[1]&&(x<x0+stub||x>x1-stub));
      set(x,y,deck?0:5)}}
  // ---- street low cover (HESCO + wrecked cars), never allowed to cut the map ----
  const SPAWN=idx(2,3);
  const connected=()=>{const seen=new Uint8Array(N*N);const st=[SPAWN];seen[SPAWN]=1;let n=1;
    while(st.length){const c=st.pop(),cx=c%N,cy=c/N|0;for(const nb of[cx>0?c-1:-1,cx<N-1?c+1:-1,cy>0?c-N:-1,cy<N-1?c+N:-1])
      if(nb>=0&&!seen[nb]&&(grid[nb]===0||grid[nb]===2)){seen[nb]=1;n++;st.push(nb)}}
    let tot=0;for(let i=0;i<N*N;i++)if(grid[i]===0||grid[i]===2)tot++;return n===tot};
  const tryPlace=tiles=>{for(const[x,y]of tiles)if(x<0||y<0||x>=N||y>=N||grid[idx(x,y)]!==0||(x<7&&y<7))return false;
    for(const[x,y]of tiles)set(x,y,4);if(!connected()){for(const[x,y]of tiles)set(x,y,0);return false}return true};
  for(const a of[0,16,32,48])for(const b of B){
    for(const ns of[true,false]){
      const P2=(u,v)=>ns?[u,v]:[v,u];
      if(R()<.75){const lane=a+ri(0,3),s0=b+ri(1,8);
        if(R()<.5){const t=[P2(lane,s0),P2(lane,s0+1)];if(tryPlace(t)){const[x,y]=t[0];cars.push({x,y,ns})}}
        else{const t=[];const len=ri(1,3);for(let k=0;k<len;k++)t.push(P2(lane,s0+k));if(tryPlace(t))low.push(...t)}}
      if(R()<.4){const s=b+ri(2,9),side=R()<.5?0:2;const t=[P2(a+side,s),P2(a+side+1,s)];if(tryPlace(t))low.push(...t)}
    }
  }
  if(RIV){const{x0,x1,road,broke}=RIVER;
    // abandoned army checkpoint mid-span: HESCO chicane + two wrecks + a footlocker
    for(const t of[[[x0+3,road[0]],[x0+3,road[0]+1]],[[x0+6,road[1]-1],[x0+6,road[1]]]])if(tryPlace(t))low.push(...t);
    for(const[x,y]of[[x0+8,road[0]+1],[x1-3,road[1]]]){const t=[[x,y],[x+1,y]];if(tryPlace(t))cars.push({x,y,ns:false})}
    const lockers=[[x0+4,road[0]],[x0+1,broke[1]],[x1-1,broke[0]]];
    for(const[x,y]of lockers){if(grid[idx(x,y)]!==0)continue;set(x,y,3);if(!connected()){set(x,y,0);continue}conts.push({tx:x,ty:y,kind:'police',looted:false,special:false})}
    zsp.push([x0+5,road[0]+2],[x1-1,broke[0]+1],[x0+2,broke[1]-1]);
  }
  return{grid,kmap,conts,npcs,zsp,blds,gaps,low,cars,sector:RIV?'bridge':'city'};
}

/* ================= METRO (user-supplied CityGenerator district, cropped to one crossroads) ================= */
let METRO=null;
async function ensureMetro(){if(METRO!==null)return;try{
  const g=await parseGLB(await pack('metro','HOLDOUT_METRO_B64'));if(WEB)await packJSON('metro_meta','HOLDOUT_METRO_META');
  const clip=new T.Plane(new T.Vector3(0,-1,0),4);const mats=[];
  linearMaps(g.scene);const an=renderer?Math.min(8,renderer.capabilities.getMaxAnisotropy()):4;
  g.scene.traverse(o=>{if(!o.isMesh)return;o.frustumCulled=true;o.material=metroMat(o.material,clip,an);mats.push(o.material)});
  METRO={scene:g.scene,clip,mats,groundTex:null};window.HOLDOUT_METRO_OK=true;upgradeMetro();
}catch(e){METRO=false;console.warn('Metro district failed.',e)}}
function metroMat(src,clip,an){const n=src.name||'';
  if(src.map){// real texture from the district (CC0 originals / stand-ins)
    const m=new T.MeshStandardMaterial({map:src.map,normalMap:src.normalMap||null,color:0xd8d4cc,roughness:.9,metalness:/metal|Metal|hydrant|trash|utility/.test(n)?.25:0,clippingPlanes:[clip],side:T.DoubleSide,flatShading:true});
    for(const t of[m.map,m.normalMap])if(t){t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=an||4;t.needsUpdate=true}
    if(m.normalMap)m.normalScale=new T.Vector2(.8,.8);m.name=n;return m}
  const m0=metroMat0(n,clip);if(m0.color&&!/Decals|Manhole|Grate/.test(n))m0.color.multiplyScalar(1.1);m0.flatShading=true;m0.normalMap=null;m0.needsUpdate=true;return m0}
function metroMat0(n,clip){n=n.replace(/^CityGen\s*/,'');const o={color:0x8a8a86,roughness:.9,clippingPlanes:[clip],clipShadows:true,side:T.DoubleSide};let tex=null,rep=1;
  const has=k=>KIT&&KIT.tex&&KIT.tex[k];
  if(/Decals/.test(n))return new T.MeshBasicMaterial({color:0x101010,transparent:true,opacity:.35,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,clippingPlanes:[clip]});
  if(/Manhole|Grate/.test(n)){o.color=0x2e2f30;o.metalness=.4}
  else if(/_Streets/.test(n)){o.color=0x6a6c70;tex='asphalt';rep=.12}
  else if(/side walks/.test(n)){o.color=0x6f6c66;tex='sidewalk';rep=.4}
  else if(/Curb/.test(n)){o.color=0x9a968e;tex='concrete'}
  else if(/lanes_white/.test(n))o.color=0xb8b6ae;else if(/lanes_secondary/.test(n))o.color=0xa38a3c;
  else if(/Brick/.test(n)){o.color=0x9a7a68;tex='brick'}
  else if(/concrete|roof/.test(n)){o.color=0x8e8a84;tex='concrete'}
  else if(/yellow stone/.test(n)){o.color=0xb3a07a;tex='plaster'}
  else if(/marble/.test(n)){o.color=0xc0bcb2;tex='tile'}
  else if(/black wood/.test(n)){o.color=0x3a2c22;tex='wood'}
  else if(/Glass/.test(n)){o.color=0x1c2630;o.roughness=.15;o.metalness=.6}
  else if(/Interior_Room/.test(n)){o.color=0x2a221a;o.emissive=0x3a2a16}
  else if(/Interior_Store/.test(n)){o.color=0x2a2a26;o.emissive=0x2a3236}
  else if(/Lamp_Emission/.test(n)){o.color=0xffe0b0;o.emissive=0xffc070}
  else if(/Red_Emission/.test(n)){o.color=0x400;o.emissive=0xff2010}else if(/Green_Emission/.test(n)){o.color=0x040;o.emissive=0x20ff60}else if(/Yellow_Emission/.test(n)){o.color=0x440;o.emissive=0xffb020}
  else if(/black/.test(n))o.color=0x1e1f21;else if(/dark green/.test(n))o.color=0x2c3a2c;else if(/basic white|white/.test(n))o.color=0xb4b2ac;
  else if(/gold/.test(n)){o.color=0x8a6a2a;o.metalness=.6;o.roughness=.4}else if(/metal|Metal/.test(n)){o.color=0x5c5f62;o.metalness=.4;o.roughness=.6}
  else if(/Dirt/.test(n)){o.color=0x5a4a38;tex='dirt'}else if(/yellow/.test(n))o.color=0xb08a2a;
  if(tex&&has(tex)){const m=texMat(tex,rep,rep,o.color,o.roughness);Object.assign(m,{clippingPlanes:[clip],side:T.DoubleSide});return m}
  return new T.MeshStandardMaterial(o)}
function genMetro(seed){
  R=mulberry(seed);const M=window.HOLDOUT_METRO_META;
  const grid=Uint8Array.from(M.grid),kmap=new Uint8Array(N*N);const conts=[],npcs=[],zsp=[],low=[],cars=[];
  const [sx,sy]=M.spawn,o=[(sx-2)*TILE,sy*TILE];
  for(let y=sy;y<=sy+4;y++)for(let x=sx-2;x<=sx+1;x++)if(x>=0&&x<N&&y<N&&grid[idx(x,y)]!==0)grid[idx(x,y)]=0; // clear the drop-off pad
  const sp=idx(sx,sy);
  const connected=()=>{const seen=new Uint8Array(N*N);const st=[sp];seen[sp]=1;let n=1;
    while(st.length){const c=st.pop(),cx=c%N,cy=c/N|0;for(const nb of[cx>0?c-1:-1,cx<N-1?c+1:-1,cy>0?c-N:-1,cy<N-1?c+N:-1])
      if(nb>=0&&!seen[nb]&&(grid[nb]===0||grid[nb]===2)){seen[nb]=1;n++;st.push(nb)}}
    let tot=0;for(let i=0;i<N*N;i++)if(grid[i]===0||grid[i]===2)tot++;return n===tot};
  const nearSp=(x,y,r)=>Math.abs(x-sx)+Math.abs(y-sy)<r;
  const tryPlace=(tiles,v)=>{for(const[x,y]of tiles)if(x<0||y<0||x>=N||y>=N||grid[idx(x,y)]!==0||nearSp(x,y,7))return false;
    for(const[x,y]of tiles)grid[idx(x,y)]=v;if(!connected()){for(const[x,y]of tiles)grid[idx(x,y)]=0;return false}return true};
  // the city's own wrecks, swapped for kit cars (2-tile low cover)
  for(const[x,z,yaw]of M.cars){const ns=Math.abs(Math.cos(yaw))<Math.abs(Math.sin(yaw));const tx=Math.floor(x/TILE),ty=Math.floor(z/TILE);
    const t=ns?[[tx,ty],[tx,ty+1]]:[[tx,ty],[tx+1,ty]];if(tryPlace(t,4))cars.push({x:tx,y:ty,ns})}
  // more wrecks + a police roadblock across the avenue
  for(let k=0,n=0;k<200&&n<6;k++){const x=ri(1,N-3),y=ri(1,N-3),ns=R()<.5;const t=ns?[[x,y],[x,y+1]]:[[x,y],[x+1,y]];if(tryPlace(t,4)){cars.push({x,y,ns});n++}}
  for(let k=0,n=0;k<300&&n<8;k++){const x=ri(1,N-2),y=ri(1,N-2);const t=[[x,y],[x+(R()<.5?1:0),y+(R()<.5?0:1)]];if(tryPlace(t,4)){low.push(...t.filter((p,i)=>i===0||p[0]!==t[0][0]||p[1]!==t[0][1]));n++}}
  // loot against building fronts
  const KN=['store','pharm','res','police','ware'];
  for(let k=0;k<3000&&conts.length<18;k++){const x=ri(0,N-1),y=ri(0,N-1);if(grid[idx(x,y)]!==0||nearSp(x,y,8))continue;
    if(![[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>grid[idx(clamp(x+dx,0,N-1),clamp(y+dy,0,N-1))]===1))continue;
    if(conts.some(c=>Math.abs(c.tx-x)+Math.abs(c.ty-y)<5))continue;
    grid[idx(x,y)]=3;if(!connected()){grid[idx(x,y)]=0;continue}conts.push({tx:x,ty:y,kind:pick(KN),looted:false,special:false})}
  const free=()=>{for(let k=0;k<400;k++){const x=ri(0,N-1),y=ri(0,N-1);if(grid[idx(x,y)]===0&&!nearSp(x,y,12))return[x,y]}return null};
  for(let k=0;k<14;k++){const f=free();if(f)zsp.push(f)}
  for(let k=0;k<3;k++){const f=free();if(f&&R()<.75)npcs.push({tx:f[0],ty:f[1],type:R()<.6?'surv':'raider'})}
  return{grid,kmap,conts,npcs,zsp,blds:[],gaps:new Set(),low,cars,sector:'metro',o,trees:M.trees,runs:M.runs};
}
/* ================= GRID HELPERS ================= */
const tileAt=(x,z)=>{const tx=Math.floor(x/TILE),ty=Math.floor(z/TILE);if(tx<0||ty<0||tx>=N||ty>=N)return 1;return W.grid[idx(tx,ty)]};
const tIdx=(x,z)=>idx(clamp(Math.floor(x/TILE),0,N-1),clamp(Math.floor(z/TILE),0,N-1));
const walk=i=>W.grid[i]===0||W.grid[i]===2;
const tc=i=>[(i%N+.5)*TILE,((i/N|0)+.5)*TILE];
const solidT=t=>t===1||t===3||t===4||t===5;
function blockedAt(x,z,r){return solidT(tileAt(x-r,z-r))||solidT(tileAt(x+r,z-r))||solidT(tileAt(x-r,z+r))||solidT(tileAt(x+r,z+r))}

  if(ANIM)keepAsset(ANIM.scene);if(ZOMB)ZOMB.scene.traverse(o=>{if(o.isMesh)keepG.add(o.geometry)});if(KIT)for(const k in KIT.tmpl)keepAsset(KIT.tmpl[k]);if(METRO)keepAsset(METRO.scene);
  W.grp.traverse(o=>{if(o.isMesh||o.isLine){if(o.geometry&&!keepG.has(o.geometry))o.geometry.dispose();if(o.material&&!keepM.has(o.material)&&o.material!==FLASHM&&o.material.dispose)o.material.dispose()}});

      if(e.code==='KeyE')tryUse();

      if(e.code==='KeyG'){P.gait=P.gait==='walk'?'run':'walk';toast(P.gait==='walk'?'Gait: walk':'Gait: jog')}
      if(e.code==='KeyV'){P.dbg=!P.dbg;$('#animDbg').hidden=!P.dbg}

    }

  });
  addEventListener('keyup',e=>{keys[e.code]=false});
  addEventListener('blur',()=>{for(const k in keys)keys[k]=false;firing=false;P.aim=false});
  document.addEventListener('mousemove',e=>{
    if(mode!=='field'||view!=='tps')return;
    if(document.pointerLockElement===cv||((e.buttons&1)&&!isTouch)){const s=P.aim?.0014:.0022;yaw-=e.movementX*s;pitch=clamp(pitch-e.movementY*s,-1.45,1.45);P.lookDX+=e.movementX;P.lookDY+=e.movementY}
  });

  cv.addEventListener('pointerdown',e=>{
    ac();
    if(mode!=='field'||!$('#modal').hidden)return;

      if(e.pointerType==='touch'){ptr[e.pointerId]={x:e.clientX,y:e.clientY,look:true};return}

      if(n.path.length){const [tx,tz]=tc(n.path[0]);const dx=tx-n.p.x,dz=tz-n.p.z,dd=Math.hypot(dx,dz);if(dd<.3)n.path.shift();else{const s=Math.min(dd,3.4*dt);moveCirc(n.p,dx/dd*s,dz/dd*s,.3);n.face=Math.atan2(dx,dz)}}}

function zPhys(z,dt){

function updZombie(z,dt){

  if(z.scrT>0){z.scrT-=dt;const u0=W.units.find(u=>u.alive);if(u0)z.face=lerpAng(z.face,Math.atan2(u0.p.x-z.p.x,u0.p.z-z.p.z),dt*4);pose(z.rig,{scream:true},dt);sync();return}
  let tgt=null,td=1e9;
  for(const u of W.units){if(!u.alive)continue;const d=Math.hypot(u.p.x-z.p.x,u.p.z-z.p.z);if(d<td){td=d;tgt=u}}
  if(!tgt){pose(z.rig,{},dt);sync();return}
  if(!z.aggro&&(td<3.5||(td<13&&los(z.p.x,z.p.z,tgt.p.x,tgt.p.z)))){z.aggro=true;
    if(z.rig.zm&&z.type!=='crawler'&&td>4&&Math.random()<.5){z.scrT=1.8;z.face=Math.atan2(tgt.p.x-z.p.x,tgt.p.z-z.p.z);noise(z.p.x,z.p.z,16);const dd=Math.hypot(z.p.x-camF.position.x,z.p.z-camF.position.z);snd(.3/(1+dd*.05),320,.7)}}
  let mx=0,mz=0,spd=0;
  if(z.aggro){
    if(td<1.15){z.cd-=dt;if(z.cd<=0){z.cd=1.1;z.atkT=.9;if(z.rig.zm)z.rig.atkClip=Math.random()<.5?'attack':'bite';bite(tgt,13)}z.face=lerpAng(z.face,Math.atan2(tgt.p.x-z.p.x,tgt.p.z-z.p.z),dt*8)}

      else if(W.ff){const c=tIdx(z.p.x,z.p.z),cx=c%N,cy=c/N|0;let best=-1,bv=W.ff[c]<0?1e9:W.ff[c];
        for(const n of [cx>0?c-1:-1,cx<N-1?c+1:-1,cy>0?c-N:-1,cy<N-1?c+N:-1])if(n>=0&&W.ff[n]>=0&&W.ff[n]<bv){bv=W.ff[n];best=n}
        if(best>=0){const[tx,tz]=tc(best);mx=tx-z.p.x;mz=tz-z.p.z}}

    }
  }else{
    z.wt-=dt;if(z.wt<=0){z.wt=2+Math.random()*4;const a=Math.random()*6.28;z.wd=Math.random()<.4?[0,0]:[Math.sin(a),Math.cos(a)]}

}

  }else{

function tickCallback(rdt){
  const cb=W.cb;cb.left-=rdt;
  const bar=$('#cbBar'),tt=$('#cbT');if(bar)bar.style.width=Math.max(0,cb.left/cb.max*100)+'%';if(tt)tt.textContent=Math.max(0,Math.ceil(cb.left))+'s';
  if(cb.left<=0)cbChoice('leave');

function cbChoice(m){
  const cb=W.cb;if(!cb)return;const n=cb.n,u=cb.u;
  if(m==='check'){
    const medic=W.units.some(x=>x.alive&&x.d.role==='Medic');
    const acc=.6+(medic?.3:0);
    cb.checked=Math.random()<acc?n.infected:!n.infected;cb.left-=5;
    if(cb.left<=0){cbChoice('leave');return}
    renderCallback();return;
  }
  if(m==='bring'){n.following=true;W.rescued.push(n);toast(`${n.name} is coming with you.`)}

  if(m==='capture'){n.following=true;W.caps.push(n);toast(`Raider zip-tied. ${n.name} walks with the squad.`)}
  if(m==='strip'){const a=ri(15,25);W.loot.ammo+=a;n.alive=false;W.grp.remove(n.rig.root);toast(`+${a} ammo. The raider runs.`)}
  if(m==='leave'){n.alive=false;W.grp.remove(n.rig.root);toast(`${u.d.name}: "Copy. Moving on."`)}

}

/* ================= EXTRACT / DEBRIEF ================= */
function tryExtract(){
  const alive=W.units.filter(u=>u.alive);const inZ=alive.filter(inZone);
  if(!inZ.length)return;
  const out=alive.length-inZ.length;
  if(out>0){timeScale=0;openModal(`<h2>Leave ${out} behind?</h2><p>${alive.filter(u=>!inZone(u)).map(u=>esc(u.d.name)).join(', ')} ${out>1?'are':'is'} not at the van. They will be listed as missing.</p>
    <div class="choices"><button class="btn danger" data-m="go">Extract now</button><button class="btn" data-m="wait">Wait for them</button></div>`);
    modalHandler=m=>{closeModal();modalHandler=null;timeScale=1;if(m==='go')debrief(inZ)};return}
  debrief(inZ);
}
function wipe(){
  if(mode!=='field')return;
  const lost=W.units.map(u=>u.d.name);
  G.squad=G.squad.filter(s=>!W.units.some(u=>u.d===s));
  G.ammo=W.ammo+W.mag+sideMag();
  log(`Lost contact with ${lost.join(', ')}. The sector took them.`);
  G.morale=clamp(G.morale-25,0,100);
  if(W.cache&&!W.cache.it.truth){W.cache.it.status='trap';G.cacheMarked=null}
  timeScale=0;
  openModal(`<h2>Signal lost</h2><p>The whole team went down in the sector. Nothing came back.</p><div class="choices"><button class="btn primary" data-m="ok">Back to the safehouse</button></div>`);
  modalHandler=()=>{closeModal();modalHandler=null;endDay();leaveField()};
}
function debrief(back){
  timeScale=0;exitLock();
  const backSet=new Set(back);
  const kia=W.units.filter(u=>!u.alive),mia=W.units.filter(u=>u.alive&&!backSet.has(u));
  const p=MED_P[G.up.med];
  const rows=[];
  for(const u of back)rows.push({kind:'squad',ref:u.d,name:u.d.name,inf:u.d.infected,det:u.d.infected&&Math.random()<p,admit:false});
  for(const n of W.rescued)if(n.alive)rows.push({kind:'surv',ref:n,name:n.name,inf:n.infected,det:n.infected&&Math.random()<p,admit:false});
  for(const n of W.caps)if(n.alive)rows.push({kind:'cap',ref:n,name:n.name,inf:n.infected,det:n.infected&&Math.random()<p,admit:false});
  const L=W.loot;
  const draw=()=>{
    openModal(`<h2>Gate scan</h2>
      <div class="tally"><span class="pill"><b>${L.food}</b> food</span><span class="pill"><b>${L.meds}</b> meds</span><span class="pill"><b>${L.ammo}</b> ammo</span><span class="pill"><b>${L.parts}</b> parts</span></div>
      ${kia.length?`<p class="st-bad">KIA: ${kia.map(u=>esc(u.d.name)).join(', ')}</p>`:''}
      ${mia.length?`<p class="st-bad">Missing: ${mia.map(u=>esc(u.d.name)).join(', ')}</p>`:''}
      <p class="dim">Med bay ${G.up.med?'level '+G.up.med:'is not built'}. The scanner catches about ${Math.round(p*100)}% of hidden bites. A clean scan is not a promise.</p>
      <div class="gate">${rows.map((r,i)=>`<div class="g"><div><b>${esc(r.name)}</b> <span class="dim">${r.kind==='squad'?'squad':r.kind==='surv'?'survivor':'prisoner'}</span><br>
        <span class="${r.det?'st-bad':'st-ok'}">${r.det?'Bite detected':'Clear'}</span></div>
        ${r.det?`<div class="row" style="display:flex;gap:6px"><button class="btn sm ${!r.admit?'primary':''}" data-m="q${i}">Quarantine</button><button class="btn sm ${r.admit?'danger':''}" data-m="a${i}">Let in</button></div>`:''}</div>`).join('')||'<p class="dim">Nobody came back.</p>'}</div>
      <div class="choices"><button class="btn primary" data-m="done">Open the gate</button></div>`);
  };
  draw();
  modalHandler=m=>{
    if(m[0]==='q'&&m!=='done'){rows[+m.slice(1)].admit=false;draw();return}
    if(m[0]==='a'){rows[+m.slice(1)].admit=true;draw();return}
    if(m!=='done')return;
    closeModal();modalHandler=null;
    // apply
    G.food+=L.food;G.meds+=L.meds;G.parts+=L.parts;
    G.ammo=W.ammo+W.mag+sideMag()+L.ammo;
    const names=[];
    for(const u of kia){G.squad=G.squad.filter(s=>s!==u.d);names.push(u.d.name+' KIA')}
    for(const u of mia){G.squad=G.squad.filter(s=>s!==u.d);names.push(u.d.name+' missing')}
    G.morale=clamp(G.morale+W.moraleD-kia.length*12-mia.length*8+(L.food+L.meds+L.parts>4?4:0),0,100);
    for(const r of rows){
      if(r.det&&!r.admit){
        if(r.kind==='squad'){G.squad=G.squad.filter(s=>s!==r.ref);names.push(`${r.name} quarantined`)}
        else names.push(`${r.name} turned away at the gate`);
        G.morale=clamp(G.morale-(r.kind==='squad'?10:2),0,100);
        continue;
      }
      if(r.kind==='surv'){
        if(G.squad.length<6){const s=mk(r.name,pick(ROLES),1);s.infected=r.inf;G.squad.push(s);names.push(`${r.name} joined`)}
        else names.push(`${r.name} took supplies and moved on`);

      if(r.kind==='cap'){
        G.prisoners.push({id:uid(),name:r.name,resolve:ri(35,85),loyalty:ri(20,90),pressure:0,trust:ri(0,15),injury:0,knows:{},gave:{},promised:false,hurt:false,infected:r.inf,sessionDay:0});
        names.push(`${r.name} taken to the cell`);
      }
    }
    if(W.cache){if(!W.cache.it.truth){W.cache.it.status='trap';names.push('cache intel was an ambush')}else if(W.cache.it.status!=='ok')W.cache.it.status='marked';
      if(W.cache.it.status!=='marked')G.cacheMarked=null}
    log(`Run back. Haul: ${L.food} food, ${L.meds} meds, ${L.ammo} ammo, ${L.parts} parts.${names.length?' '+names.join('; ')+'.':''}`);
    endDay();leaveField();
  };
}
function leaveField(){
  mode='base';exitLock();disposeWorld();W=null;

    case'q_settle':case'q_cache':ask(a.slice(2));break;
    case'release':fate(()=>{G.rep+=p.hurt?-4:4;log(`Released ${p.name}.${p.hurt?' Word of what happened in the cell will travel.':''}`)});return;
    case'recruit':fate(()=>{const s=mk(p.name,pick(ROLES),2);s.spy=p.loyalty>65&&Math.random()<.6;s.infected=p.infected;G.squad.push(s);log(`${p.name} switched sides and joined the squad.`)});return;
    case'trade':fate(()=>{G.meds+=3;G.ammo+=25;G.rep+=2;if(p.promised)G.morale=clamp(G.morale-4,0,100);log(`Traded ${p.name} to the settlement for 3 meds and 25 rounds.${p.promised?' The squad saw you break your word.':''}`)});return;
    case'exile':fate(()=>{if(p.hurt)G.grudge++;if(p.promised)G.morale=clamp(G.morale-4,0,100);log(`Exiled ${p.name} past the fence.${p.hurt?' They left angry.':''}`)});return;
    case'back':closeInterro();return;
  }
  if(timed&&!IQ.dead)IQ.left--;
  if(IQ.left<=0&&!IQ.dead)say('sys','Time\'s up for today.');
  save();renderInterro();
});
function fate(fn){const p=IQ.p;G.prisoners=G.prisoners.filter(x=>x!==p);fn();save();closeInterro()}
function closeInterro(){IQ=null;$('#interro').hidden=true;$('#base').hidden=false;save();renderBase()}
function ask(topic){
  const p=IQ.p;
  say('you',topic==='settle'?'"Where do your people live?"':'"Where\'s your crew\'s stash?"');
  if(p.gave[topic]){say('them','"I already told you."');return}
  if(p.knows[topic]===undefined)p.knows[topic]=Math.random()<(topic==='settle'?.85:.65);
  const P=p.pressure,Rz=p.resolve;
  let talks=true,truthP=.85,broken=false;
  if(p.trust>=55)truthP=.9;
  else if(P<Rz-20)talks=false;
  else if(P<=Rz+10)truthP=.8;
  else{truthP=.2;broken=true}
  if(!talks){say('them',pick(LINES.refuse));return}
  if(!p.knows[topic]&&!(broken&&Math.random()<.7)){say('them','"I don\'t know. I swear I don\'t know."');return}
  const truth=p.knows[topic]&&Math.random()<truthP;
  const place=pick(PLACES[topic]);
  p.gave[topic]=true;
  say('them',topic==='settle'?`"We're holed up at ${place}."`:`"There's a stash in ${place}."`);
  if(!truth&&Math.random()<.6)say('tell',pick(LINES.tells));
  else if(truth&&Math.random()<.25)say('tell','His story holds when you ask it a second way.');
  G.intel.push({id:uid(),topic,truth,place,from:p.name,day:G.day,status:'new',text:topic==='settle'?`Settlement at ${place}`:`Supply cache in ${place}`});
}

/* ================= LOBBY 3D ================= */

}

function lobbyProps(){
  if(!LOBBY||LOBBY.props||!KIT)return;LOBBY.props=true;const g=LOBBY.g;
  const ground=new T.Mesh(new T.PlaneGeometry(90,90),KIT.tex.dirt?texMat('dirt',22,22,0x9b8a70,1):new T.MeshStandardMaterial({color:0x3a3128,roughness:1}));ground.rotation.x=-Math.PI/2;g.add(ground);
  const put=(id,x,z,ry,sc)=>{const o=kitClone(id);if(!o)return null;o.position.set(x,0,z);o.rotation.y=ry||0;if(sc)o.scale.setScalar(sc);g.add(o);return o};
  put('campfire',-2.9,-2.4,0);put('tent',-5.2,-5.2,.5);put('bedroll',-3.8,-3.6,1.2);put('workbench',-5.6,-1.6,1.3);
  for(let x=-8;x<=8;x+=2)put('fence_fort',x,-6.6,0);
  put('crate_big',3.3,-2.6,.3);put('crate_big',3.4,-2.6,.1)&&0;const c2=put('crate',3.2,-2.5,.6);if(c2)c2.position.y=1.3;
  put('barrel',2.4,-3.3,0);put('barrel',2.9,-3.9,1);put('car_van',6.2,-4.6,-.7);put('signpost',-1.4,-4.6,.3);put('epole',7.5,-7.5,0);
  for(const[id,x,z,s2]of[['n_pine',-9,-10,1],['n_oak',-4,-12,1.1],['n_pine2',2,-11,1],['n_detailed',7,-10,1.1],['n_pine',11,-12,1.2],['n_fat',-12,-7,1],['n_bush',-6.4,-6,1],['n_bush2',5,-6.2,1],['n_rockL',-8,-4,.6],['n_grass',1.6,-1.6,1.2],['n_grass2',-1.2,-1.9,1.3],['n_stump',4.6,-1.2,1]])put(id,x,z,x*.7,s2);
  const pl=lightPool();pl.rotation.x=-Math.PI/2;pl.position.set(-2.9,.02,-2.4);pl.scale.setScalar(.7);g.add(pl);

function lobbyWant(){
  if(!G.squad.length)return[];
  if(LTAB==='ops')return[LSEL];
  return G.squad.filter(x=>deploySel.has(x.id)&&x.hp>0).slice(0,4).map(x=>x.id);
}
function lobbyOp(s,i){
  const team=new T.Color(TEAM[i%4]).getHex();
  const r=makeSkinned('op',{team,variant:clamp(G.up.arm,1,4),tier:G.up.arm});
  if(SOLD)attachDress(r,lookOf(s),team);
  LOBBY.g.add(r.root);return{r,team}}
function lobbySync(){
  lobbyEnsure();if(!ANIM||!LOBBY)return;lobbyProps();
  const want=lobbyWant();
  for(const[id,o]of LOBBY.ops)if(!want.includes(id)||!G.squad.some(x=>x.id===id)){LOBBY.g.remove(o.r.root);LOBBY.ops.delete(id)}
  want.forEach((id,i)=>{const s=G.squad.find(x=>x.id===id);if(!s)return;let o=LOBBY.ops.get(id);if(!o){o=lobbyOp(s,G.squad.indexOf(s));LOBBY.ops.set(id,o)}o.slot=i;o.s=s});
  const focus=LTAB==='ops';
  for(const o of LOBBY.ops.values()){const sl=focus?[0,0,0]:want.length===1?[0,0,0]:LSLOT[want.length===2?o.slot+1:want.length===3?[0,1,3][o.slot]:o.slot];

function lobbyLook(s){save();const o=LOBBY&&LOBBY.ops.get(s.id);if(o&&o.r.dress)setDressLook(o.r,lookOf(s),o.team)}
function renderTags(){const el=$('#ltags');if(!LOBBY){el.innerHTML='';return}

    const tg=tags[ti++];if(tg){r.b.head.getWorldPosition(_lv);_lv.y+=.42;_lv.project(L.cam);
      tg.style.left=((_lv.x*.5+.5)*w)+'px';tg.style.top=((-_lv.y*.5+.5)*h)+'px';tg.style.display=LTAB==='ops'||_lv.z>1?'none':''}}

(()=>{const host=$('#base');let d=null;
  host.addEventListener('pointerdown',e=>{if(LTAB!=='ops'||e.target.closest('.lpanel,.ltop,.lfoot'))return;d={x:e.clientX,s:LOBBY?LOBBY.spin:0}});
  addEventListener('pointermove',e=>{if(d&&LOBBY)LOBBY.spin=d.s+(e.clientX-d.x)*.012});
